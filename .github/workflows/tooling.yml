# ProsperoStore - Lint, test, build the release ZIP, and publish it for a version tag.
# Copyright (C) 2026 BlackBearReloaded
# SPDX-License-Identifier: GPL-3.0-or-later
name: Build

# A pull request, a version tag or a run started by hand is linted, tested and built. A tag
# "v1.000.040" (for contentVersion "01.000.040" in sce_sys/param.json) also publishes a
# pre-release with the app-folder ZIP and its checksum. The ZIP is the only release file, and
# every entry in it is stored with permissions 0777: the console only starts an app whose
# files are open to all.
on:
  # A build on main is started by hand (Run workflow): pushes to main build nothing.
  push:
    tags:
      - "v[0-9]*.[0-9][0-9][0-9].[0-9][0-9][0-9]"
  pull_request:
  workflow_dispatch:
    inputs:
      snapshot:
        description: "Also publish this run's compiler cache as the build-cache snapshot (run it on main)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, test, and build the ZIP
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # The two write entries are for the attestation step only: a signing identity for this run,
    # and storing the attestation. A pull request from a fork gets neither, whatever is asked.
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      CCACHE_DIR: ${{ github.workspace }}/.deps/ccache
      CCACHE_MAXSIZE: 500M

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install native toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-18 clang-format-18 lld-18 make ninja-build ccache pkg-config tar unzip wget git libcurl4-openssl-dev openssl

      - name: Restore dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .deps/native
            .deps/test
            .deps/pacbrew
            .deps/lapy
            .deps/ps5-opengl
          key: deps-${{ runner.os }}-${{ runner.arch }}-ubuntu24-python313-${{ hashFiles('tools/setup-*-dependencies.sh', 'tools/build-lapy-helper.py', 'tools/fetch-opengl-sdk.sh', 'tools/prepare-opengl.sh') }}

      - name: Restore compiler cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .deps/ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-clang18-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ runner.arch }}-clang18-

      # GitHub drops a cache nobody used for a week, and a pull request only sees main's. When
      # nothing was restored, start from the snapshot kept as a file of the build-cache release;
      # a manual run on main with "snapshot" ticked replaces that file (build-cache.yml).
      - name: Fetch the compiler cache snapshot
        run: |
          if [ -z "$(ls -A "$CCACHE_DIR" 2>/dev/null)" ]; then
            url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/build-cache/ccache-clang18.tar"
            if curl -fsSL --retry 3 -o "$RUNNER_TEMP/ccache-clang18.tar" "$url"; then
              mkdir -p "$CCACHE_DIR"
              tar -xf "$RUNNER_TEMP/ccache-clang18.tar" -C "$CCACHE_DIR"
              rm "$RUNNER_TEMP/ccache-clang18.tar"
              echo "::notice title=Compiler cache::Started from the build-cache snapshot."
            fi
          fi

      - name: Configure parallel compilation
        run: |
          echo "BUILD_JOBS=$(nproc)" >> "$GITHUB_ENV"
          echo "USE_CCACHE=1" >> "$GITHUB_ENV"
          ccache --zero-stats

      - name: Read app identity and version
        shell: bash
        run: |
          metadata=$(python3 -c 'import json; p=json.load(open("sce_sys/param.json")); print(p["titleId"], p["contentVersion"])')
          read -r title_id content_version <<< "$metadata"
          [[ $title_id =~ ^PPSA[0-9]{5}$ ]] || exit 2
          [[ $content_version =~ ^[0-9]{2}\.[0-9]{3}\.[0-9]{3}$ ]] || exit 2
          # contentVersion 01.000.040 is released as tag v1.000.040.
          release_tag="v$((10#${content_version%%.*})).${content_version#*.}"
          if [[ $GITHUB_REF_TYPE == tag && $GITHUB_REF_NAME != "$release_tag" ]]; then
            echo "The tag must be $release_tag for param.json contentVersion $content_version" >&2
            exit 2
          fi
          echo "TITLE_ID=$title_id" >> "$GITHUB_ENV"
          echo "CONTENT_VERSION=$content_version" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$release_tag" >> "$GITHUB_ENV"

      # A pull request's build is named by its number and its own commit, on the
      # artifact and inside the app folder (docs/PULL_REQUEST_BUILDS.md); the version in
      # param.json stays the release's.
      - name: Name this build
        id: label
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ $GITHUB_EVENT_NAME == pull_request ]]; then
            short=${PR_HEAD:0:7}
            echo "artifact=${GITHUB_REPOSITORY##*/}-PR$PR_NUMBER-$short" >> "$GITHUB_OUTPUT"
            echo "BUILD_LABEL=PR $PR_NUMBER, $short" >> "$GITHUB_ENV"
          else
            echo "artifact=prosperostore-$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          fi

      # Formatting, licence headers, scripts and assets. Static analysis (clang-tidy) takes
      # 15 to 25 minutes on a runner and is left to "make lint" on a developer machine.
      - name: Lint source and metadata
        run: LINT_SKIP_TIDY=1 make lint

      - name: Run the store's tests
        run: make test

      - name: Build the app and its release ZIP
        run: make release-zip

      - name: Report compiler cache statistics
        if: always()
        run: ccache --show-stats

      # ccache compresses what it stores, so the snapshot is a plain tar.
      - name: Pack the compiler cache snapshot
        if: github.event_name == 'workflow_dispatch' && inputs.snapshot
        run: tar -cf "$RUNNER_TEMP/ccache-clang18.tar" -C "$CCACHE_DIR" .

      - name: Upload the compiler cache snapshot
        if: github.event_name == 'workflow_dispatch' && inputs.snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ccache-snapshot
          path: ${{ runner.temp }}/ccache-clang18.tar
          if-no-files-found: error
          retention-days: 1

      - name: Check the ZIP and write its checksum
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          python3 - "$TITLE_ID.zip" "$TITLE_ID" "$CONTENT_VERSION" <<'PY'
          import json, sys, zipfile
          archive, title, version = sys.argv[1:4]
          with zipfile.ZipFile(archive) as z:
              names = z.namelist()
              assert all(n.startswith(title + "/") for n in names), "entries outside the app folder"
              assert title + "/eboot.bin" in names, "no eboot.bin"
              wrong = [i.filename for i in z.infolist() if (i.external_attr >> 16) & 0o777 != 0o777]
              assert not wrong, f"entries not stored as 0777: {wrong[:3]}"
              meta = json.loads(z.read(title + "/sce_sys/param.json"))
              assert meta["contentVersion"] == version, meta["contentVersion"]
              print(f"{archive}: {len(names)} entries, all 0777, version {version}")
          PY
          sha256sum "$TITLE_ID.zip" > SHA256SUMS
          cat SHA256SUMS

      # Signed provenance: this ZIP was built by this workflow from this commit. Anyone can check a
      # downloaded copy with `gh attestation verify <file> -R <owner>/<repo>`. Not for pull requests
      # (a fork's run cannot sign), and not in a private repository (the plan does not include it).
      - name: Attest the release ZIP
        if: github.event_name != 'pull_request' && !github.event.repository.private
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/${{ env.TITLE_ID }}.zip

      - name: Upload build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.label.outputs.artifact }}
          path: |
            dist/${{ env.TITLE_ID }}.zip
            dist/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: GitHub release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write

    steps:
      - name: Download verified build
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh run download "$GITHUB_RUN_ID"
          --repo "$GITHUB_REPOSITORY"
          --name "prosperostore-$GITHUB_SHA"
          --dir release

      - name: Publish the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cd release
          mapfile -t zips < <(find . -type f -name 'PPSA*.zip')
          mapfile -t sums < <(find . -type f -name 'SHA256SUMS')
          if (( ${#zips[@]} != 1 || ${#sums[@]} != 1 )); then
            echo "Expected exactly one app-folder ZIP and SHA256SUMS." >&2
            exit 1
          fi
          (cd "$(dirname "${sums[0]}")" && sha256sum -c SHA256SUMS)
          TAG=$GITHUB_REF_NAME
          # CI is the source of truth for release files: create the release, or fill one that
          # has no ZIP yet, and never replace a ZIP that is already published.
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" "${zips[0]}" "${sums[0]}" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --prerelease \
              --generate-notes \
              --title "ProsperoStore ${TAG#v} (alpha)"
            exit 0
          fi
          existing=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          while IFS= read -r name; do
            if [[ $name == *.zip ]]; then
              echo "::warning title=Release files not from this run::A release for $TAG already has a ZIP; it was not replaced. Its files were not published by this run and may have no attestation."
              exit 0
            fi
          done <<< "$existing"
          # Notes written in advance, or a draft: add the two files, leave title and notes alone.
          gh release upload "$TAG" "${zips[0]}" "${sums[0]}" --repo "$GITHUB_REPOSITORY"
